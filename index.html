      }

      container.innerHTML = html;
      var refreshBtn = document.getElementById('refreshBtn_locations');
      if (refreshBtn) refreshBtn.onclick = function () { renderLocations(container, true); };

      if (canManage) {
        var formEl = document.getElementById('createLocationForm');
        var openForm = function () { formEl.style.display = 'block'; };
        var toggleBtn = document.getElementById('toggleCreateLocationForm');
        if (toggleBtn) toggleBtn.onclick = function () { formEl.style.display = formEl.style.display === 'none' ? 'block' : 'none'; };
        var emptyBtn = document.getElementById('emptyAddLocation');
        if (emptyBtn) emptyBtn.onclick = openForm;
        document.getElementById('cancelCreateLocation').onclick = function () { formEl.style.display = 'none'; };
        var submitBtn = document.getElementById('submitCreateLocation');
        submitBtn.onclick = function () {
          withButtonBusy(submitBtn, 'Creating…', function (restore) {
            var errorEl = document.getElementById('createLocationError');
            errorEl.innerText = '';
            var name = document.getElementById('newLocationName').value.trim();
            if (!name) { errorEl.innerText = 'Location name is required.'; restore(); return; }
            callWithSession('createLocation', { businessId: currentBusinessId, locationName: name, locationType: document.getElementById('newLocationType').value }).then(function (result) {
              restore();
              if (!result.success) { showFormError(errorEl, result); return; }
              showToast('Location created successfully.\n' + name, 'success');
              invalidateCache('locations');
              renderLocations(container, true);
            }).catch(function (err) { restore(); errorEl.innerText = 'Network error: ' + err; });
          });
        };
        wireEntityStatusButtons_(container);
      }
    }

    // ============================================================
    // Purchases
    // ============================================================
    var PAYMENT_METHODS = ['CASH', 'BANK', 'CARD', 'MOBILE_PAYMENT', 'CHEQUE', 'OTHER'];
    var ADDITIONAL_COST_TYPES = ['Freight', 'Customs', 'Loading', 'Insurance', 'Other'];
    var purchasesPageData = [];
    var purchasableItemsCache = null;

    function renderPurchasesList(container, forceRefresh) {
      var cached = getCache('purchases');
      if (cached && !forceRefresh) { purchasesPageData = cached; drawPurchasesListScreen(container); return; }
      container.innerHTML = loadingState('Loading purchases…');
      Promise.all([
        callWithSession('listPurchases', { businessId: currentBusinessId }),
        callWithSession('listVendors', { businessId: currentBusinessId }),
        callWithSession('listLocations', { businessId: currentBusinessId })
      ]).then(function (results) {
        var failed = results.find(function (r) { return !r.success; });
        if (failed) { container.innerHTML = errorState(humanizeError(failed)); return; }
        purchasesPageData = { purchases: results[0].data, vendors: results[1].data, locations: results[2].data };
        setCache('purchases', purchasesPageData);
        drawPurchasesListScreen(container);
      }).catch(function (err) { container.innerHTML = errorState('Network error: ' + err); });
    }

    function drawPurchasesListScreen(container) {
      var canManage = currentContext.permissions.indexOf('PURCHASE_MANAGE') !== -1;
      var d = purchasesPageData;
      var html = '<div class="header-row"><div></div><div>' + refreshButton_('purchases');
      if (canManage) html += ' <button class="btn" id="toggleCreatePurchaseForm">+ New Purchase</button>';
      html += '</div></div>';

      if (canManage) {
        var hasPrereqs = d.vendors.length > 0 && d.locations.length > 0;
        html += '<div class="form-panel" id="createPurchaseForm" style="display:none;">';
        if (!hasPrereqs) {
          html += '<p style="color:#b5730a">You need at least one Vendor and one Location before starting a Purchase.</p>';
        } else {
          html += '<div class="form-row">'
            + '<div class="form-field"><label>Vendor <span class="required">*</span></label><select id="newPurchaseVendor">' + optionsFor_(d.vendors, 'vendorId', 'vendorName') + '</select></div>'
            + '<div class="form-field"><label>Location <span class="required">*</span></label><select id="newPurchaseLocation">' + optionsFor_(d.locations, 'locationId', 'locationName') + '</select></div>'
            + '</div><div class="form-actions"><button class="btn" id="submitCreatePurchase">Start Draft</button>'
            + '<button class="btn-secondary" id="cancelCreatePurchase">Cancel</button></div>'
            + '<div class="form-error" id="createPurchaseError"></div>';
        }
        html += '</div>';
      }

      if (d.purchases.length === 0) {
        html += emptyState('No purchases yet.', canManage ? '<button class="btn" id="emptyAddPurchase">+ New Purchase</button>' : '');
      } else {
        html += '<table><thead><tr><th>Vendor</th><th>Location</th><th>Status</th><th>Grand Total</th><th></th></tr></thead><tbody>';
        d.purchases.slice().reverse().forEach(function (p) {
          var vendor = d.vendors.find(function (v) { return v.vendorId === p.vendorId; });
          var loc = d.locations.find(function (l) { return l.locationId === p.locationId; });
          html += '<tr><td>' + (vendor ? vendor.vendorName : p.vendorId) + '</td><td>' + (loc ? loc.locationName : p.locationId) + '</td>'
            + '<td>' + statusBadge(p.status) + '</td>'
            + '<td>' + money(p.grandTotal) + '</td>'
            + '<td><button class="btn-small" data-open-purchase="' + p.purchaseId + '">Open</button></td></tr>';
        });
        html += '</tbody></table>';
      }

      container.innerHTML = html;
      var refreshBtn = document.getElementById('refreshBtn_purchases');
      if (refreshBtn) refreshBtn.onclick = function () { renderPurchasesList(container, true); };

      container.querySelectorAll('[data-open-purchase]').forEach(function (btn) {
        btn.onclick = function () { renderPurchaseDetail(container, btn.getAttribute('data-open-purchase')); };
      });

      if (canManage) {
        var formEl = document.getElementById('createPurchaseForm');
        var openForm = function () { formEl.style.display = 'block'; };
        var toggleBtn = document.getElementById('toggleCreatePurchaseForm');
        if (toggleBtn) toggleBtn.onclick = function () { formEl.style.display = formEl.style.display === 'none' ? 'block' : 'none'; };
        var emptyBtn = document.getElementById('emptyAddPurchase');
        if (emptyBtn) emptyBtn.onclick = openForm;
        var cancelBtn = document.getElementById('cancelCreatePurchase');
        if (cancelBtn) cancelBtn.onclick = function () { formEl.style.display = 'none'; };
        var submitBtn = document.getElementById('submitCreatePurchase');
        if (submitBtn) submitBtn.onclick = function () {
          withButtonBusy(submitBtn, 'Starting…', function (restore) {
            var errorEl = document.getElementById('createPurchaseError');
            errorEl.innerText = '';
            callWithSession('createPurchaseDraft', {
              businessId: currentBusinessId,
              vendorId: document.getElementById('newPurchaseVendor').value,
              locationId: document.getElementById('newPurchaseLocation').value
            }).then(function (result) {
              restore();
              if (!result.success) { showFormError(errorEl, result); return; }
              invalidateCache('purchases');
              renderPurchaseDetail(container, result.data.purchaseId);
            }).catch(function (err) { restore(); errorEl.innerText = 'Network error: ' + err; });
          });
        };
      }
    }

    function getPurchasableItems() {
      if (purchasableItemsCache && purchasableItemsCache.businessId === currentBusinessId) return Promise.resolve(purchasableItemsCache.items);
      return callWithSession('listProducts', { businessId: currentBusinessId }).then(function (productsResult) {
        if (!productsResult.success) return [];
        var products = productsResult.data;
        return Promise.all(products.map(function (p) {
          return callWithSession('listProductVariants', { businessId: currentBusinessId, productId: p.productId }).then(function (r) {
            return (r.success ? r.data : []).map(function (v) { return { variantId: v.variantId, label: p.productName + (v.variantName && v.variantName !== 'Default' ? ' — ' + v.variantName : ''), unitId: v.unitId }; });
          });
        })).then(function (perProduct) {
          var items = [].concat.apply([], perProduct);
          purchasableItemsCache = { businessId: currentBusinessId, items: items };
          return items;
        });
      });
    }

    function renderPurchaseDetail(container, purchaseId) {
      container.innerHTML = loadingState('Loading purchase…');
      Promise.all([
        callWithSession('getPurchase', { businessId: currentBusinessId, purchaseId: purchaseId }),
        callWithSession('listPurchaseLines', { businessId: currentBusinessId, purchaseId: purchaseId }),
        callWithSession('listAdditionalPurchaseCosts', { businessId: currentBusinessId, purchaseId: purchaseId }),
        callWithSession('listPurchasePayments', { businessId: currentBusinessId, purchaseId: purchaseId }),
        callWithSession('listUnits', { businessId: currentBusinessId }),
        getPurchasableItems()
      ]).then(function (results) {
        var apiResults = results.slice(0, 5);
        var failed = apiResults.find(function (r) { return !r.success; });
        if (failed) { container.innerHTML = errorState(humanizeError(failed)); return; }
        drawPurchaseDetailScreen(container, { purchase: apiResults[0].data, lines: apiResults[1].data, additionalCosts: apiResults[2].data, payments: apiResults[3].data, units: apiResults[4].data, purchasableItems: results[5] });
      }).catch(function (err) { container.innerHTML = errorState('Network error: ' + err); });
    }

    function drawPurchaseDetailScreen(container, data) {
      var canManage = currentContext.permissions.indexOf('PURCHASE_MANAGE') !== -1;
      var p = data.purchase;
      var html = '<div class="header-row"><button class="btn-secondary" id="backToPurchasesList">← Back to Purchases</button>' + statusBadge(p.status) + '</div>';

      html += '<div class="card-grid">'
        + card('Subtotal', money(p.subtotal)) + card('Additional Cost', money(p.additionalCostTotal)) + card('Grand Total', money(p.grandTotal))
        + card('Amount Paid', money(p.amountPaid)) + card('Amount Due', money(p.amountDue), p.amountDue <= 0)
        + '</div>';

      html += '<div class="section-title">Lines</div>';
      if (data.lines.length === 0) {
        html += emptyState('No lines yet.');
      } else {
        html += '<table><thead><tr><th>Item</th><th>Qty</th><th>Vendor Unit Cost</th><th>Additional Alloc.</th><th>Landed Unit Cost</th><th>Line Total</th></tr></thead><tbody>';
        data.lines.forEach(function (l) {
          var item = data.purchasableItems.find(function (i) { return i.variantId === l.variantId; });
          html += '<tr><td>' + (item ? item.label : l.variantId) + '</td><td>' + fmt(l.quantity) + '</td><td>' + money(l.actualVendorUnitCost) + '</td>'
            + '<td>' + (l.additionalAllocatedCost != null ? money(l.additionalAllocatedCost) : '—') + '</td>'
            + '<td>' + (l.landedUnitCost != null ? money(l.landedUnitCost) : '—') + '</td><td>' + money(l.lineTotal) + '</td></tr>';
        });
        html += '</tbody></table>';
      }

      if (canManage && p.status === 'DRAFT') {
        html += '<div class="form-panel"><div class="section-title" style="margin-top:0">Add Line</div><div class="form-row">'
          + '<div class="form-field"><label>Item <span class="required">*</span></label><select id="addLineVariant">' + optionsFor_(data.purchasableItems, 'variantId', 'label') + '</select></div>'
          + '<div class="form-field"><label>Quantity <span class="required">*</span></label><input type="number" id="addLineQty" step="0.01"></div>'
          + '<div class="form-field"><label>Unit <span class="required">*</span></label><select id="addLineUnit">' + optionsFor_(data.units, 'unitId', 'unitName') + '</select></div>'
          + '<div class="form-field"><label>Vendor Unit Cost <span class="required">*</span></label><input type="number" id="addLineCost" step="0.01"></div>'
          + '</div><div class="form-actions"><button class="btn" id="submitAddLine">Add Line</button></div>'
          + '<div class="form-error" id="addLineError"></div></div>';
      }

      html += '<div class="section-title">Additional Costs</div>';
      if (data.additionalCosts.length === 0) {
        html += emptyState('None yet.');
      } else {
        html += '<table><thead><tr><th>Type</th><th>Amount</th></tr></thead><tbody>';
        data.additionalCosts.forEach(function (c) { html += '<tr><td>' + c.costType + '</td><td>' + money(c.amount) + '</td></tr>'; });
        html += '</tbody></table>';
      }
      if (canManage && p.status === 'DRAFT') {
        html += '<div class="form-panel"><div class="section-title" style="margin-top:0">Add Additional Cost</div><div class="form-row">'
          + '<div class="form-field"><label>Type</label><select id="addCostType">' + ADDITIONAL_COST_TYPES.map(function (t) { return '<option value="' + t + '">' + t + '</option>'; }).join('') + '</select></div>'
          + '<div class="form-field"><label>Amount <span class="required">*</span></label><input type="number" id="addCostAmount" step="0.01"></div>'
          + '</div><div class="form-actions"><button class="btn" id="submitAddCost">Add Cost</button></div>'
          + '<div class="form-error" id="addCostError"></div></div>';
      }

      if (canManage && p.status === 'DRAFT') {
        html += '<div class="form-actions" style="margin:16px 0;"><button class="btn" id="submitPostPurchase"' + (data.lines.length === 0 ? ' disabled' : '') + '>Post Purchase</button></div>';
      }
      if (canManage && (p.status === 'POSTED' || p.status === 'PARTIALLY_PAID' || p.status === 'PAID')) {
        html += '<div class="form-actions" style="margin:16px 0;"><button class="btn-secondary" id="submitReceivePurchase">Receive into Inventory</button></div>';
      }

      html += '<div class="section-title">Payments</div>';
      if (data.payments.length === 0) {
        html += emptyState('No payments yet.');
      } else {
        html += '<table><thead><tr><th>Amount</th><th>Method</th><th>Notes</th></tr></thead><tbody>';
        data.payments.forEach(function (pay) { html += '<tr><td>' + money(pay.amount) + '</td><td>' + pay.paymentMethod + '</td><td>' + (pay.notes || '—') + '</td></tr>'; });
        html += '</tbody></table>';
      }
      if (canManage && p.status !== 'DRAFT' && p.status !== 'CANCELLED' && p.amountDue > 0) {
        html += '<div class="form-panel"><div class="section-title" style="margin-top:0">Record Payment</div><div class="form-row">'
          + '<div class="form-field"><label>Amount (Due: ' + money(p.amountDue) + ') <span class="required">*</span></label><input type="number" id="paymentAmount" step="0.01"></div>'
          + '<div class="form-field"><label>Method</label><select id="paymentMethod">' + PAYMENT_METHODS.map(function (m) { return '<option value="' + m + '">' + m + '</option>'; }).join('') + '</select></div>'
          + '</div><div class="form-actions"><button class="btn" id="submitPayment">Record Payment</button></div>'
          + '<div class="form-error" id="paymentError"></div></div>';
      }

      container.innerHTML = html;

      document.getElementById('backToPurchasesList').onclick = function () { renderPurchasesList(container, true); };

      var addLineBtn = document.getElementById('submitAddLine');
      if (addLineBtn) addLineBtn.onclick = function () {
        withButtonBusy(addLineBtn, 'Adding…', function (restore) {
          var errorEl = document.getElementById('addLineError');
          errorEl.innerText = '';
          var qty = parseFloat(document.getElementById('addLineQty').value);
          var cost = parseFloat(document.getElementById('addLineCost').value);
          if (!qty || qty <= 0) { errorEl.innerText = 'Quantity must be a positive number.'; restore(); return; }
          if (isNaN(cost) || cost < 0) { errorEl.innerText = 'Vendor Unit Cost must be a non-negative number.'; restore(); return; }
          callWithSession('addPurchaseLine', { businessId: currentBusinessId, purchaseId: p.purchaseId, input: { variantId: document.getElementById('addLineVariant').value, quantity: qty, purchaseUnitId: document.getElementById('addLineUnit').value, actualVendorUnitCost: cost } }).then(function (result) {
            restore();
            if (!result.success) { showFormError(errorEl, result); return; }
            renderPurchaseDetail(container, p.purchaseId);
          }).catch(function (err) { restore(); errorEl.innerText = 'Network error: ' + err; });
        });
      };

      var addCostBtn = document.getElementById('submitAddCost');
      if (addCostBtn) addCostBtn.onclick = function () {
        withButtonBusy(addCostBtn, 'Adding…', function (restore) {
          var errorEl = document.getElementById('addCostError');
          errorEl.innerText = '';
          var amount = parseFloat(document.getElementById('addCostAmount').value);
          if (isNaN(amount) || amount <= 0) { errorEl.innerText = 'Amount must be a positive number.'; restore(); return; }
          callWithSession('addAdditionalPurchaseCost', { businessId: currentBusinessId, purchaseId: p.purchaseId, costType: document.getElementById('addCostType').value, amount: amount }).then(function (result) {
            restore();
            if (!result.success) { showFormError(errorEl, result); return; }
            renderPurchaseDetail(container, p.purchaseId);
          }).catch(function (err) { restore(); errorEl.innerText = 'Network error: ' + err; });
        });
      };

      var postBtn = document.getElementById('submitPostPurchase');
      if (postBtn) postBtn.onclick = function () {
        showConfirm('Post this Purchase?', 'Once posted, lines and additional costs can no longer be changed. This cannot be undone.', function () {
          withButtonBusy(postBtn, 'Posting…', function (restore) {
            callWithSession('postPurchase', { businessId: currentBusinessId, purchaseId: p.purchaseId }).then(function (result) {
              restore();
              if (!result.success) { handleApiError(result); return; }
              invalidateCache('purchases');
              var posted = result.data;
              showToast('Purchase posted successfully.\nPurchase ID: ' + posted.purchaseId + '\nTotal: ' + money(posted.grandTotal), 'success');
              renderPurchaseDetail(container, p.purchaseId);
            }).catch(function (err) { restore(); showToast('Network error: ' + err, 'error'); });
          });
        });
      };

      var receiveBtn = document.getElementById('submitReceivePurchase');
      if (receiveBtn) receiveBtn.onclick = function () {
        showConfirm('Receive into Inventory?', 'This will add the purchased quantities to your real stock at their landed cost.', function () {
          withButtonBusy(receiveBtn, 'Receiving…', function (restore) {
            callWithSession('receivePurchase', { businessId: currentBusinessId, purchaseId: p.purchaseId }).then(function (result) {
              restore();
              if (!result.success) { handleApiError(result); return; }
              showToast('Stock received successfully.', 'success');
              renderPurchaseDetail(container, p.purchaseId);
            }).catch(function (err) { restore(); showToast('Network error: ' + err, 'error'); });
          });
        });
      };

      var paymentBtn = document.getElementById('submitPayment');
      if (paymentBtn) paymentBtn.onclick = function () {
        var amount = parseFloat((document.getElementById('paymentAmount') || {}).value);
        if (!amount || amount <= 0) { document.getElementById('paymentError').innerText = 'Amount must be a positive number.'; return; }
        showConfirm('Record this payment?', 'Recording ' + money(amount) + ' against this purchase.', function () {
          withButtonBusy(paymentBtn, 'Recording…', function (restore) {
            var errorEl = document.getElementById('paymentError');
            errorEl.innerText = '';
            callWithSession('recordPurchasePayment', { businessId: currentBusinessId, purchaseId: p.purchaseId, amount: amount, paymentMethod: document.getElementById('paymentMethod').value }).then(function (result) {
              restore();
              if (!result.success) { showFormError(errorEl, result); return; }
              invalidateCache('purchases');
              showToast('Payment recorded successfully.\nAmount: ' + money(amount) + '\nRemaining Due: ' + money(result.data ? (p.amountDue - amount) : null), 'success');
              renderPurchaseDetail(container, p.purchaseId);
            }).catch(function (err) { restore(); errorEl.innerText = 'Network error: ' + err; });
          });
        });
      };
    }

    // Run on initial page load.
    tryResumeSession();
  </script>
</body>
</html>
