          + '<div class="form-error" id="paymentError"></div></div>';
      }

      container.innerHTML = html;

      document.getElementById('backToPurchasesList').onclick = function () { renderPurchasesList(container, true); };

      var addLineBtn = document.getElementById('submitAddLine');
      if (addLineBtn) addLineBtn.onclick = function () {
        var errorEl = document.getElementById('addLineError');
        errorEl.innerText = '';
        var qty = parseFloat(document.getElementById('addLineQty').value);
        var cost = parseFloat(document.getElementById('addLineCost').value);
        if (!qty || qty <= 0) { errorEl.innerText = 'Quantity must be positive.'; return; }
        if (isNaN(cost) || cost < 0) { errorEl.innerText = 'Vendor Unit Cost must be a non-negative number.'; return; }
        callWithSession('addPurchaseLine', {
          businessId: currentBusinessId, purchaseId: p.purchaseId,
          input: { variantId: document.getElementById('addLineVariant').value, quantity: qty, purchaseUnitId: document.getElementById('addLineUnit').value, actualVendorUnitCost: cost }
        }).then(function (result) {
          if (!result.success) { errorEl.innerText = result.message; return; }
          renderPurchaseDetail(container, p.purchaseId);
        }).catch(function (err) { errorEl.innerText = 'Network/server error: ' + err; });
      };

      var addCostBtn = document.getElementById('submitAddCost');
      if (addCostBtn) addCostBtn.onclick = function () {
        var errorEl = document.getElementById('addCostError');
        errorEl.innerText = '';
        var amount = parseFloat(document.getElementById('addCostAmount').value);
        if (isNaN(amount) || amount <= 0) { errorEl.innerText = 'Amount must be positive.'; return; }
        callWithSession('addAdditionalPurchaseCost', {
          businessId: currentBusinessId, purchaseId: p.purchaseId,
          costType: document.getElementById('addCostType').value, amount: amount
        }).then(function (result) {
          if (!result.success) { errorEl.innerText = result.message; return; }
          renderPurchaseDetail(container, p.purchaseId);
        }).catch(function (err) { errorEl.innerText = 'Network/server error: ' + err; });
      };

      var postBtn = document.getElementById('submitPostPurchase');
      if (postBtn) postBtn.onclick = function () {
        showConfirm('Post this Purchase?', 'Once posted, lines and additional costs can no longer be changed. This cannot be undone.', function () {
          postBtn.disabled = true; postBtn.innerText = 'Posting…';
          callWithSession('postPurchase', { businessId: currentBusinessId, purchaseId: p.purchaseId }).then(function (result) {
            if (!result.success) { handleApiError(result); postBtn.disabled = false; postBtn.innerText = 'Post Purchase'; return; }
            if (viewCache[currentBusinessId]) delete viewCache[currentBusinessId].purchases;
            showToast('Purchase posted successfully.', 'success');
            renderPurchaseDetail(container, p.purchaseId);
          }).catch(function (err) { showToast('Network/server error: ' + err, 'error'); postBtn.disabled = false; postBtn.innerText = 'Post Purchase'; });
        });
      };

      var receiveBtn = document.getElementById('submitReceivePurchase');
      if (receiveBtn) receiveBtn.onclick = function () {
        showConfirm('Receive into Inventory?', 'This will add the purchased quantities to your real stock at their landed cost.', function () {
          receiveBtn.disabled = true; receiveBtn.innerText = 'Receiving…';
          callWithSession('receivePurchase', { businessId: currentBusinessId, purchaseId: p.purchaseId }).then(function (result) {
            if (!result.success) { handleApiError(result); receiveBtn.disabled = false; receiveBtn.innerText = 'Receive into Inventory'; return; }
            showToast('Stock received successfully.', 'success');
            renderPurchaseDetail(container, p.purchaseId);
          }).catch(function (err) { showToast('Network/server error: ' + err, 'error'); receiveBtn.disabled = false; receiveBtn.innerText = 'Receive into Inventory'; });
        });
      };

      var paymentBtn = document.getElementById('submitPayment');
      if (paymentBtn) paymentBtn.onclick = function () {
        var errorEl = document.getElementById('paymentError');
        errorEl.innerText = '';
        var amount = parseFloat(document.getElementById('paymentAmount').value);
        if (!amount || amount <= 0) { errorEl.innerText = 'Amount must be positive.'; return; }
        callWithSession('recordPurchasePayment', {
          businessId: currentBusinessId, purchaseId: p.purchaseId, amount: amount, paymentMethod: document.getElementById('paymentMethod').value
        }).then(function (result) {
          if (!result.success) { errorEl.innerText = result.message; return; }
          if (viewCache[currentBusinessId]) delete viewCache[currentBusinessId].purchases;
          renderPurchaseDetail(container, p.purchaseId);
        }).catch(function (err) { errorEl.innerText = 'Network/server error: ' + err; });
      };
    }

    // Run on initial page load.
    tryResumeSession();
  </script>
</body>
</html>
