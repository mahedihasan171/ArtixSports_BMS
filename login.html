<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ArtixSports — Login (GitHub Pages)</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 60px auto; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
    .warn { color: #a00; }
  </style>
</head>
<body>
  <h2>ArtixSports — Login</h2>
  <p>This page exists only to host the Google Sign-In button on a
     registerable origin. All session/user logic still happens in
     Apps Script — this page never sees a session token except to
     display it.</p>

  <!--
    FILL IN before publishing:
    - data-client_id: your GOOGLE_OAUTH_CLIENT_ID (not a secret, safe to hardcode)
  -->
  <div id="g_id_onload"
       data-client_id="1001782158795-l4ue3qpltm6tjtcqhrjeqbfggf0srh21.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <p id="status"></p>
  <pre id="output"></pre>

  <button onclick="testResolve()">Test whoami (current session)</button>
  <button onclick="testLogout()">Test logout</button>

  <script>
    // FILL IN: your deployed Apps Script Web App /exec URL.
    var APPS_SCRIPT_URL = 'https://n-w4vlaanbnjl3xnw5orxsqob2mglbggubmknxoyq-0lu-script.googleusercontent.com';

    var currentSessionToken = null;

    function callAppsScript(action, extra) {
      var body = Object.assign({ action: action }, extra || {});
      // Content-Type MUST be text/plain — application/json triggers a
      // CORS preflight (OPTIONS) that Apps Script cannot answer.
      return fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      }).then(function (res) { return res.json(); });
    }

    function handleCredentialResponse(response) {
      document.getElementById('status').innerText = 'Verifying token with the server...';
      callAppsScript('login', { idToken: response.credential })
        .then(function (result) {
          document.getElementById('output').innerText = JSON.stringify(result, null, 2);
          if (result.success) {
            currentSessionToken = result.data.sessionToken;
            document.getElementById('status').innerText = 'Signed in as ' + result.data.email;
          } else {
            document.getElementById('status').innerText = 'Login failed: ' + result.message;
          }
        })
        .catch(function (err) {
          document.getElementById('status').innerText = 'Network/server error';
          document.getElementById('output').innerText = String(err);
        });
    }

    function testResolve() {
      callAppsScript('whoami', { sessionToken: currentSessionToken })
        .then(function (result) {
          document.getElementById('output').innerText = JSON.stringify(result, null, 2);
        });
    }

    function testLogout() {
      callAppsScript('logout', { sessionToken: currentSessionToken })
        .then(function (result) {
          document.getElementById('output').innerText = JSON.stringify(result, null, 2);
          document.getElementById('status').innerText = 'Logged out';
          currentSessionToken = null;
        });
    }
  </script>
</body>
</html>
